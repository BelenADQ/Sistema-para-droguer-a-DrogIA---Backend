spring.datasource.url=jdbc:h2:mem:drogia;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=test-secret-with-at-least-32-bytes-1234567890
jwt.expiration-ms=3600000

gmail.user=
gmail.app-password=
gmail.ingesta.enabled=false

gemini.api-key=
gemini.model=gemini-2.5-flash
gemini.base-url=http://localhost:1
gemini.timeout-seconds=5

storage.base-path=./build/test-storage
app.seed.enabled=true
app.cors.allowed-origins=http://localhost:5173
